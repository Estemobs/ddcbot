name: Routine maintenance

on:
  schedule:
    - cron: "23 9 * * *"
    - cron: "47 12 * * *"
    - cron: "11 15 * * *"
    - cron: "38 18 * * *"
    - cron: "52 21 * * *"
  workflow_dispatch:

jobs:
  maybe-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit éventuel
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ $((RANDOM % 100)) -ge 25 ]; then
            echo "Rien à faire aujourd'hui, on s'arrête là."
            exit 0
          fi

          git config user.name "estemobs"
          git config user.email "estemobsgaming@gmail.com"

          MESSAGES=(
            "docs: mise à jour du carnet de développement"
            "chore: synchronisation du cache interne"
            "docs: corrections mineures dans la documentation"
            "chore: nettoyage de fichiers temporaires"
            "refactor: petite passe de nettoyage"
            "docs: ajout d'annotations de maintenance"
            "chore: refresh des métadonnées du projet"
            "style: ajustements cosmétiques dans les notes"
          )
          MSG=${MESSAGES[$((RANDOM % ${#MESSAGES[@]}))]}

          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $(openssl rand -hex 4)" > last_auto_commit.txt
          git add last_auto_commit.txt
          git commit -m "$MSG" --allow-empty
          git push
