name: Rapport santé quotidien

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  health-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt -r requirements-dashboard.txt -r requirements-dev.txt

      - name: Générer le rapport
        run: |
          set +e
          FLAKE_CRIT=$(flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics 2>&1)
          FLAKE_CRIT_RC=$?
          FLAKE_FULL_COUNT=$(flake8 . --count --exit-zero 2>&1 | tail -1)
          COMPILE_OUT=$(python -m compileall -q . 2>&1)
          COMPILE_RC=$?
          PYTEST_OUT=$(pytest -q 2>&1 | tail -20)
          PYTEST_RC=$?
          TODO_COUNT=$(grep -rIn "TODO\|FIXME" --include="*.py" . | wc -l)

          {
            echo "# Rapport santé — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| Check | Résultat |"
            echo "|---|---|"
            echo "| flake8 (erreurs critiques E9/F63/F7/F82) | $([ $FLAKE_CRIT_RC -eq 0 ] && echo '✅ OK' || echo "❌ voir détails") |"
            echo "| flake8 (total warnings, non bloquant) | $FLAKE_FULL_COUNT |"
            echo "| compileall | $([ $COMPILE_RC -eq 0 ] && echo '✅ OK' || echo '❌ échec') |"
            echo "| pytest | $([ $PYTEST_RC -eq 0 ] && echo '✅ OK' || echo '❌ échec') |"
            echo "| TODO/FIXME dans le code | $TODO_COUNT |"
            echo ""
            if [ $FLAKE_CRIT_RC -ne 0 ]; then
              echo "<details><summary>Erreurs flake8 critiques</summary>"
              echo ""
              echo '```'
              echo "$FLAKE_CRIT"
              echo '```'
              echo "</details>"
              echo ""
            fi
            echo "<details><summary>Sortie pytest</summary>"
            echo ""
            echo '```'
            echo "$PYTEST_OUT"
            echo '```'
            echo "</details>"
          } > STATUS.md

      - name: Committer si changement
        run: |
          git config user.name "estemobs"
          git config user.email "estemobsgaming@gmail.com"
          git add STATUS.md
          if git diff --cached --quiet; then
            echo "Rien de nouveau, pas de commit."
            exit 0
          fi
          git commit -m "chore: rapport santé du projet $(date -u +%F)"
          git push
