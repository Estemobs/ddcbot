<!DOCTYPE html>
<html lang="{{ current_lang() }}" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DDCBot Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    (function () {
      var theme = localStorage.getItem('dash_theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
    function toggleTheme() {
      var html = document.documentElement;
      var next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      localStorage.setItem('dash_theme', next);
    }
    function setLang(lang) {
      document.cookie = 'dash_lang=' + lang + '; path=/; max-age=31536000';
      location.reload();
    }
  </script>
</head>
<body>
  <!-- Header/hero -->
  <header class="hero">
    <div class="brand">
      <h1>DDCBot</h1>
      <p>Administration du bot Discord</p>
    </div>
    <div class="badge">
      <span>{{ nav_guilds() | length }} serveurs</span>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="nav-top">
    <div class="flex">
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
        <span>&#9632;</span> Accueil
      </a>
      <a href="/guilds" class="{% if request.url.path.startswith('/guild/') %}active{% endif %}">
        <span>&#128241;</span> Serveurs
      </a>
      <a href="/notes" class="{% if request.url.path == '/notes' %}active{% endif %}">
        <span>&#9998;</span> Notes
      </a>
      <a href="/transactions" class="{% if request.url.path == '/transactions' %}active{% endif %}">
        <span>&#8644;</span> Transactions
      </a>
      <a href="/reminders" class="{% if request.url.path == '/reminders' %}active{% endif %}">
        <span>&#9200;</span> Rappels
      </a>
      <a href="/giveaways" class="{% if request.url.path == '/giveaways' %}active{% endif %}">
        <span>&#127873;</span> Giveaways
      </a>
    </div>

    <div class="flex justify-end items-center">
      <button class="theme-toggle" onclick="toggleTheme()" title="Thème">
        <span class="sun">☀️</span>
        <span class="moon">🌙</span>
      </button>
      
      <div class="lang-dropdown">
        <button class="lang-dropdown-btn" onclick="event.stopPropagation();">
          <span>{{ current_lang() }}</span>
          <svg width="8" height="4" viewBox="0 0 8 4" fill="none">
            <path d="M2 2l3.5 3.5" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <div class="lang-dropdown-list" id="lang-list">
          <a href="?lang=fr" class="lang-dropdown-item {% if current_lang() == 'fr' %}open{% endif %}">Français</a>
          <a href="?lang=en" class="lang-dropdown-item {% if current_lang() == 'en' %}open{% endif %}">English</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="dashboard">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
