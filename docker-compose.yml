services:
  ddcbot:
    build: .
    container_name: ddcbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ${PROJECT_DIR}:/app

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ddcbot-dashboard
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"
    volumes:
      - ${PROJECT_DIR}:/app
    depends_on:
      - ddcbot

  updater:
    build: ./docker/updater
    container_name: ddcbot-updater
    restart: unless-stopped
    environment:
      - GIT_BRANCH=${GIT_BRANCH:-master}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-60}
    volumes:
      - ${PROJECT_DIR}:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /repo
